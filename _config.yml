title: Torn Rules
remote_theme: just-the-docs/just-the-docs

color_scheme: dark # dark mode
nav_sort: case_insensitive

aux_links:
  "GitHub":
    - "//github.com/rezidentvx/torn-rules"

nav_external_links:
  - title: Contact
    url: https://www.torn.com/profiles.php?XID=2077404

# Footer last edited timestamp for pages with `last_modified_date` defined in the frontmatter
last_edit_timestamp: true # enable
last_edit_time_format: "%H:%M:%S - %d/%m/%y (%Z)"

# Footer GH link
gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: "View this page on GitHub"
gh_edit_repository: "https://github.com/rezidentvx/torn-rules" # the github URL for your repo
gh_edit_branch: "main" # the branch that your docs is served from
gh_edit_view_mode: "tree"

callouts:
  needs_citation:
    title: Citations Needed
    color: yellow
  rule:
    title: Rule Text
    color: blue

plugins:
  - jekyll-remote-theme